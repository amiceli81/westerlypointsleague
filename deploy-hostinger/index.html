<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Westerly Points League</title>
<style id="app-style">

  :root{
    --bg:#F3EEE1; --surface:#FFFFFF; --surface-2:#ECE5D3;
    --text:#211B14; --text-dim:#6B6154;
    --accent:#B8792C; --accent-strong:#8F5D1F; --accent-ink:#FFFFFF;
    --line:#DCD3BC;
    --win:#2F7D52; --loss:#B23A2E; --push:#5B7083;
    --win-bg:#E4F0E8; --loss-bg:#F5E2DF; --push-bg:#E7EBEE;
    --shadow: 0 1px 2px rgba(33,27,20,.06), 0 8px 20px -12px rgba(33,27,20,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10161F; --surface:#172230; --surface-2:#1D2B3A;
      --text:#F1ECE0; --text-dim:#8FA3B5;
      --accent:#E3A857; --accent-strong:#F0BE7C; --accent-ink:#1B140A;
      --line:#2A3A4A;
      --win:#4C9A6A; --loss:#D9584A; --push:#7C93A8;
      --win-bg:#16261E; --loss-bg:#2B1B18; --push-bg:#1B2530;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 24px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#10161F; --surface:#172230; --surface-2:#1D2B3A;
    --text:#F1ECE0; --text-dim:#8FA3B5;
    --accent:#E3A857; --accent-strong:#F0BE7C; --accent-ink:#1B140A;
    --line:#2A3A4A;
    --win:#4C9A6A; --loss:#D9584A; --push:#7C93A8;
    --win-bg:#16261E; --loss-bg:#2B1B18; --push-bg:#1B2530;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 24px -14px rgba(0,0,0,.6);
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:Arial,Helvetica,sans-serif; font-weight:700;
    letter-spacing:.01em; text-wrap:balance; margin:0;
  }
  .mono{ font-family:Arial,Helvetica,sans-serif; font-variant-numeric:tabular-nums; }
  .eyebrow{ font-family:Arial,Helvetica,sans-serif; font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--text-dim); }
  a{ color:var(--accent-strong); }
  button{ font-family:inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  #toast-root{ position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:999; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
  .toast{ background:var(--text); color:var(--bg); font-size:.85rem; padding:9px 16px; border-radius:7px; box-shadow:var(--shadow); max-width:88vw; }

  .app-shell{ max-width:1180px; margin:0 auto; padding:0 16px 64px; }

  header.top{ position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--line); padding:14px 16px 0; }
  header.top .row{ max-width:1180px; margin:0 auto; display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; padding-bottom:12px; }
  .pool-title{ font-size:2.1rem; line-height:1; }
  .pool-title small{ display:block; font-family:Arial,Helvetica,sans-serif; font-size:.62rem; letter-spacing:.14em; text-transform:uppercase; color:var(--text-dim); margin-bottom:2px; }
  .who-chip{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:7px 12px; box-shadow:var(--shadow); }
  .who-chip .name{ font-weight:600; font-size:.88rem; }
  .who-chip .bal{ font-size:1.05rem; font-weight:600; }
  button.linklike{ font-size:.7rem; color:var(--text-dim); background:none; border:none; text-decoration:underline; cursor:pointer; padding:0; }
  button.player-link{ font:inherit; color:var(--accent-strong); background:none; border:none; text-decoration:underline; text-underline-offset:2px; cursor:pointer; padding:0; }
  button.player-link:hover{ color:var(--accent); }

  nav.tabs{ max-width:1180px; margin:0 auto; display:flex; gap:4px; overflow-x:auto; }
  nav.tabs button{
    background:none; border:none; border-bottom:3px solid transparent; color:var(--text-dim);
    font-family:Arial,Helvetica,sans-serif; font-size:.78rem; letter-spacing:.08em; text-transform:uppercase;
    padding:10px 14px 9px; cursor:pointer; white-space:nowrap;
  }
  nav.tabs button.active{ color:var(--text); border-bottom-color:var(--accent); font-weight:600; }
  nav.tabs button:hover:not(.active){ color:var(--text); }

  .readonly-banner{ background:var(--push-bg); color:var(--push); border-bottom:1px solid var(--line); font-size:.82rem; padding:8px 16px; text-align:center; }

  .layout{ display:grid; grid-template-columns:240px 1fr; gap:24px; align-items:start; padding-top:22px; }
  @media (max-width:820px){
    .layout{ grid-template-columns:1fr; }
    .layout main{ order:1; }
    .layout aside.sidebar{ order:2; }
  }
  aside.sidebar{ position:sticky; top:78px; display:flex; flex-direction:column; gap:0; }
  .board-head{ padding:14px 16px; border-bottom:1px dashed var(--line); background:var(--surface-2); }
  .board-head h3{ font-size:1.1rem; }
  .board-post{ padding:12px 16px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:5px; }
  .board-post:last-child{ border-bottom:none; }
  .board-post .msg{ font-size:.87rem; white-space:pre-wrap; overflow-wrap:anywhere; }
  .board-post .meta{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .board-empty{ padding:16px; text-align:center; color:var(--text-dim); font-size:.85rem; }
  .board-post-form{ padding:12px 16px; border-bottom:1px dashed var(--line); display:flex; flex-direction:column; gap:8px; }
  .board-post-form textarea{ padding:8px 10px; border:1px solid var(--line); border-radius:7px; background:var(--bg); color:var(--text); font-size:.85rem; font-family:inherit; resize:vertical; min-height:64px; }
  main{ padding-top:0; display:flex; flex-direction:column; gap:22px; }
  .empty{ border:1px dashed var(--line); border-radius:10px; padding:32px 20px; text-align:center; color:var(--text-dim); }
  .empty a.btn{ margin-top:10px; }

  .week-head{ display:flex; align-items:baseline; gap:10px; margin:6px 0 -6px; }
  .week-head h2{ font-size:1.4rem; }

  .toolbar{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .sport-filter{ display:flex; gap:4px; }
  .sport-filter button{ font-family:Arial,Helvetica,sans-serif; font-size:.72rem; padding:5px 12px; border-radius:20px; border:1px solid var(--line); background:var(--surface); color:var(--text-dim); cursor:pointer; }
  .sport-filter button.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
  label.toggle{ display:flex; align-items:center; gap:7px; font-size:.8rem; color:var(--text-dim); cursor:pointer; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:9px; box-shadow:var(--shadow); overflow:hidden; }

  .game-card .g-head{ display:flex; justify-content:space-between; align-items:center; padding:11px 16px; border-bottom:1px dashed var(--line); background:var(--surface-2); }
  .game-card .g-head .lines{ display:flex; gap:8px; }
  .chip{ font-family:Arial,Helvetica,sans-serif; font-size:.72rem; padding:3px 8px; border-radius:5px; border:1px solid var(--line); color:var(--text-dim); }
  .status-badge{ font-family:Arial,Helvetica,sans-serif; font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:20px; border:1px solid var(--accent); color:var(--accent-strong); }
  .status-badge.final{ border-color:var(--line); color:var(--text-dim); background:var(--surface); }

  .matchup{ padding:14px 16px 6px; display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .team{ flex:1; min-width:140px; }
  .team .tname{ font-size:1.7rem; line-height:1; }
  .team .tline{ font-size:.82rem; color:var(--text-dim); margin-top:1px; }
  .team .tscore{ font-size:1.7rem; }
  .vs{ align-self:center; color:var(--text-dim); font-family:Arial,Helvetica,sans-serif; font-size:.75rem; }

  .pick-form{ padding:12px 16px 16px; display:flex; flex-direction:column; gap:14px; }
  .pick-block{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  .pick-block .label{ font-family:Arial,Helvetica,sans-serif; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim); width:52px; }
  .opt{ display:flex; align-items:center; gap:5px; border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer; font-size:.85rem; }
  .opt input{ margin:0; accent-color:var(--accent); }
  .opt.checked{ border-color:var(--accent); background:var(--surface-2); }
  .pts-input{ width:76px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); font-family:Arial,Helvetica,sans-serif; -moz-appearance:textfield; }
  .pts-input::-webkit-outer-spin-button, .pts-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .pick-actions{ display:flex; justify-content:flex-end; gap:8px; }

  .recap{ padding:12px 16px 16px; display:flex; flex-direction:column; gap:6px; font-size:.86rem; }
  .recap-row{ display:flex; justify-content:space-between; gap:10px; }
  .result-pill{ font-family:Arial,Helvetica,sans-serif; font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; padding:2px 8px; border-radius:20px; }
  .result-pill.win{ background:var(--win-bg); color:var(--win); }
  .result-pill.loss{ background:var(--loss-bg); color:var(--loss); }
  .result-pill.push{ background:var(--push-bg); color:var(--push); }
  .result-pill.pending{ background:var(--surface-2); color:var(--text-dim); }

  button.btn{ background:var(--accent); color:var(--accent-ink); border:none; border-radius:7px; padding:9px 16px; font-weight:600; font-size:.85rem; cursor:pointer; }
  button.btn:hover{ background:var(--accent-strong); }
  button.btn.ghost{ background:none; color:var(--text-dim); border:1px solid var(--line); }
  button.btn.ghost:hover{ color:var(--text); border-color:var(--text-dim); }
  button.btn.danger{ background:none; color:var(--loss); border:1px solid var(--loss); }
  button.btn:disabled{ opacity:.5; cursor:not-allowed; }

  table.board{ width:100%; border-collapse:collapse; font-size:.88rem; }
  table.board th{ text-align:left; font-family:Arial,Helvetica,sans-serif; font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); padding:9px 14px; border-bottom:1px solid var(--line); }
  table.board td{ padding:10px 14px; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.board tr:last-child td{ border-bottom:none; }
  table.board td.num, table.board th.num{ font-family:Arial,Helvetica,sans-serif; text-align:right; }
  .sortable-th{ font:inherit; letter-spacing:inherit; text-transform:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer; }
  .sortable-th:hover{ color:var(--text); }
  .rank{ color:var(--text-dim); }
  .rank.top{ color:var(--accent-strong); font-weight:700; }
  .table-wrap{ overflow-x:auto; }

  .auth-tabs{ display:flex; border-bottom:1px solid var(--line); }
  .auth-tabs button{ flex:1; background:none; border:none; padding:12px; font-family:Arial,Helvetica,sans-serif; font-size:.75rem; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); cursor:pointer; border-bottom:3px solid transparent; }
  .auth-tabs button.active{ color:var(--text); border-bottom-color:var(--accent); font-weight:600; }
  .hint{ font-size:.78rem; color:var(--text-dim); line-height:1.4; margin:0; }

  form.panel{ display:flex; flex-direction:column; gap:12px; padding:16px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  @media (max-width:560px){ .grid2,.grid3{ grid-template-columns:1fr; } }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:.72rem; color:var(--text-dim); font-family:Arial,Helvetica,sans-serif; letter-spacing:.06em; text-transform:uppercase; }
  .field input, .field select{ padding:9px 10px; border:1px solid var(--line); border-radius:7px; background:var(--bg); color:var(--text); font-size:.88rem; }
  .field textarea{ padding:9px 10px; border:1px solid var(--line); border-radius:7px; background:var(--bg); color:var(--text); font-size:.88rem; font-family:inherit; resize:vertical; }
  .rules-textarea{ width:100%; min-height:420px; padding:14px 16px; border:1px solid var(--line); border-radius:9px; background:var(--bg); color:var(--text); font-size:.92rem; font-family:inherit; line-height:1.55; resize:vertical; box-sizing:border-box; }
  .rules-text{ padding:16px; white-space:pre-wrap; line-height:1.6; font-size:.92rem; }
  .section-title{ padding:14px 16px 0; }
  .section-title h3{ font-size:1.15rem; }
  hr.rule{ border:none; border-top:1px dashed var(--line); margin:0; }
  .admin-game-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .admin-game-row:last-child{ border-bottom:none; }
  .admin-game-row .meta{ font-size:.82rem; color:var(--text-dim); }
  .inline-settle{ display:flex; align-items:center; gap:6px; }
  .inline-settle input{ width:52px; padding:5px 6px; border:1px solid var(--line); border-radius:5px; background:var(--bg); color:var(--text); font-family:Arial,Helvetica,sans-serif; }
  .pin-gate{ padding:32px 16px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .pin-gate input{ text-align:center; letter-spacing:.3em; font-size:1.1rem; width:140px; }
  footer.note{ text-align:center; color:var(--text-dim); font-size:.76rem; padding:10px 0 30px; }
</style>
</head>

 year correction wagers are allowed.  EX. If you wager 40 in       error with the actual intention of 400 you can enter a wager of 360 on the exact same bet and I will not penalize you.                                       \n     C)   There is no way to set an option on the site to make sure everyone wagers half of their shares each week.  However, I will check everyone\u2019s selections, and make the necessary adjustments.  If you do not wager half of your shares, the managers will take away the shares up to half of your total.  \n \n4)  ALL PICKS MUST BE SUBMITTED BEFORE KICKOFF OF YOUR FIRST GAME.  Within a given week, there is no re-betting winnings or chasing loses.  For example, you can not take shares won from college games on Saturday and then use them on NFL bets on Sunday or Monday.        \n\n    A)  For all bets that are made after the kickoff of your first game, winnings will be subtracted and losses will stand.  More points/shares may be lost as well to make sure you wagered half of your points/shares. There is no way to set an option on the site to make sure you place all of your wagers before your first game, so make sure you know what your doing before confirming picks.\n     B) You do not have to put all your picks in at once, they just all have to be in before kickoff of your first game.\n     C)  All wagers placed on the site are time stamped. \n     D)  Make sure your picks are accurate before you submit them.  League administrators will not change picks for guys that make mistakes.  You can't call your bookie and change a bet you've made...\n \n5)  The site will provide all lines for the games. They do not always set the spread to end with 1/2 point. \n     A)  Spreads can change day to day.  At the time you select your games, those lines are locked in to your picks.  Guys placing wagers on Thursday on college and pro games may have different lines than guys that only wager on Sunday\u2019s pro games.\n     B)  Once you select and confirm your ama is playing Southwestern Texas Community College.  The line says \u201cAlabama is getting 20 pts\u201d.\n \n11.Pay before Week 5 no later than kick off of the October 6th Monday Night Football NFL Game .  Either by Venmo @amiceli81 or PayPal @AMiceli1981 only.\n\n12)  As long as you place 4 rule abiding bets between Thursday September 4 and the end of Monday Night Football September 8 your team is valid.  No teams can join after the first week of the NFL Season.\n \n13)  Payouts: \nFirst place \u2013 55%     \t\nSecond place \u2013 25%    \nThird place \u2013  10%     \nFourth and Fifth place - 5% each\t"}</script>

  var pendingAdditions = { players: [], wagers: [] };

  function randomSaltHex(){
    var arr = new Uint8Array(16);
    crypto.getRandomValues(arr);
    return Array.from(arr).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  }
  function sha256Hex(text){
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest('SHA-256', enc).then(function(buf){
      return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
    });
  }
  function hashNewPassword(password){
    var salt = randomSaltHex();
    return sha256Hex(salt + ':' + password).then(function(hash){ return { salt: salt, hash: hash }; });
  }
  function verifyPassword(password, salt, expectedHash){
    return sha256Hex(salt + ':' + password).then(function(hash){ return hash === expectedHash; });
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function fmtLine(n){
    if(n === 0) return 'PK';
    var v = Math.round(n*10)/10;
    return (v > 0 ? '+' : '') + (Number.isInteger(v) ? v.toFixed(1) : v);
  }
  function fmtNum(n){
    var v = Math.round(n*10)/10;
    return Number.isInteger(v) ? String(v) : String(v);
  }
  function fmtSigned(n){
    return (n > 0 ? '+' : '') + n;
  }
  function toLocalInputValue(isoString){
    // Converts an absolute instant (full ISO, e.g. from the odds sync) into

    // treats it as local time already.
    if(!isoString) return '';
    var d = new Date(isoString);
    if(isNaN(d.getTime())) return '';
    function pad(n){ return String(n).padStart(2,'0'); }
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function fmtDate(isoString){

  // ---------- scoring ----------
  function gameResult(game){
    if(game.status !== 'final' || game.finalHome == null || game.finalAway == null) return null;
    var favMargin = game.favorite === 'away' ? (game.finalAway - game.finalHome) : (game.finalHome - game.finalAway);
    var atsSide;
    if(favMargin > game.spread) atsSide = game.favorite;
    else if(favMargin < game.spread) atsSide = (game.favorite === 'home') ? 'away' : 'home';
    else atsSide = 'push';
    var total = game.finalHome + game.finalAway;
    var ouSide;
    if(total > game.total) ouSide = 'over';
    else if(total < game.total) ouSide = 'under';
    else ouSide = 'push';
    return { atsSide: atsSide, ouSide: ouSide };
  }

  function wagerResult(wager, game){
    if(!game) return 'pending';
    var gr = gameResult(game);
    if(!gr) return 'pending';
    var side = wager.type === 'ATS' ? gr.atsSide : gr.ouSide;
    if(side === 'push') return 'push';
    return wager.pick === side ? 'win' : 'loss';
  }

  function gameById(id){ return state.games.filter(function(g){ return g.id === id; })[0] || null; }

  function rosterUsernames(){
    var set = {};
    state.players.forEach(function(p){ set[p.username] = true; });
    state.wagers.forEach(function(w){ set[w.player] = true; });
    return Object.keys(set).sort(function(a,b){ return displayName(a).localeCompare(displayName(b)); });
  }

  function playerAdjustmentTotal(name){
    return state.adjustments.filter(function(a){ return a.player === name; })
      .reduce(function(sum, a){ return sum + a.amount; }, 0);
  }

  function playerStats(name){
    var wins=0, losses=0, pushes=0, net=0, pending=0;
    state.wagers.forEach(function(w){
      if(w.player !== name) return;
      var g = gameById(w.gameId);
      var r = wagerResult(w, g);
      if(r === 'pending') pending += w.points;
      else if(r === 'win'){ wins++; net += w.points; }
      else if(r === 'loss'){ losses++; net -= w.points; }
      else if(r === 'push'){ pushes++; }
    });
    var adj = playerAdjustmentTotal(name);
    return { wins:wins, losses:losses, pushes:pushes, net:net + adj, adjustments: adj, balance: state.startingBalance + net + adj, pending: pending };
  }

  function playerWager(gameId, player, type){
    return state.wagers.filter(function(w){ return w.gameId===gameId && w.player===player && w.type===type; })[0] || null;
  }

  // ---------- current-week wagering compliance ----------
  function tuesdayWindowStart(d){
    // Football weeks run Tuesday-through-Monday. Given any date, returns
    // midnight (local time) on the Tuesday that starts its week.
    var day = d.getDay(); // 0=Sun..6=Sat
    var diff = (day - 2 + 7) % 7; // days since the most recent Tuesday
    var start = new Date(d.getFullYear(), d.getMonth(), d.getDate() - diff);
    start.setHours(0,0,0,0);
    return start;
  }

  function currentWeekWindowForSport(sport){
    // The "current week" for one sport is the Tuesday-Monday window
    // containing right now, among THAT sport's games. If none of that
    // sport's games fall in today's window (its season hasn't started yet,
    // it's a bye, or it's already over), fall back to the most recent PAST
    // week only -- never an upcoming week that hasn't started. Keeping this
    // per-sport (rather than one shared window) matters because NFL and
    // NCAAF seasons don't line up on the calendar -- e.g. NCAAF's current
    // week can be well underway while NFL hasn't kicked off its season yet.
    var withKickoff = state.games.filter(function(g){ return g.sport === sport && g.kickoff; });
    if(!withKickoff.length) return null;
    var now = new Date();
    var nowStart = tuesdayWindowStart(now);
    var nowEnd = new Date(nowStart.getTime() + 7*24*60*60*1000);
    var hasThisWeek = withKickoff.some(function(g){
      var kt = new Date(g.kickoff);
      return kt >= nowStart && kt < nowEnd;
    });
    if(hasThisWeek) return { start: nowStart, end: nowEnd };
    var past = withKickoff.filter(function(g){ return new Date(g.kickoff) < nowStart; });
    if(past.length){
      var latest = past.reduce(function(a,b){ return new Date(a.kickoff) > new Date(b.kickoff) ? a : b; });
      var s2 = tuesdayWindowStart(new Date(latest.kickoff));
      return { start: s2, end: new Date(s2.getTime() + 7*24*60*60*1000) };
    }
    return null;
  }

  function weekKey(sport, week){ return sport + '|' + week; }

  function autoWeekVisible(sport, week){
    // The original automatic rule (current week by kickoff date, per sport)
    // -- now used only as the DEFAULT for any sport+week the commissioner
    // hasn't explicitly overridden via the Week visibility tool.
    var win = currentWeekWindowForSport(sport);
    if(!win) return false;
    return state.games.some(function(g){
      if(g.sport !== sport || g.week !== week || !g.kickoff) return false;
      var kt = new Date(g.kickoff);
      return kt >= win.start && kt < win.end;
    });
  }

  function isWeekVisible(sport, week){
    // Explicit true/false from the commissioner always wins; otherwise fall
    // back to the automatic current-week-by-date rule, so a week the
    // commissioner has never touched behaves exactly as it always has.
    var key = weekKey(sport, week);
    if(Object.prototype.hasOwnProperty.call(state.weekVisibility, key)){
      return !!state.weekVisibility[key];
    }
    return autoWeekVisible(sport, week);
  }

  function allSportWeeks(){
    // Every distinct (sport, week) pairing among games that have a kickoff
    // (a week can't be placed on an auto/manual timeline without one),
    // sorted by that group's earliest kickoff.
    var groups = {};
    state.games.forEach(function(g){
      if(!g.sport || !g.week || !g.kickoff) return;
      var key = weekKey(g.sport, g.week);
      if(!groups[key]) groups[key] = { sport: g.sport, week: g.week, earliest: g.kickoff };
      else if(new Date(g.kickoff) < new Date(groups[key].earliest)) groups[key].earliest = g.kickoff;
    });
    return Object.keys(groups).map(function(k){ return groups[k]; }).sort(function(a,b){
      return new Date(a.earliest) - new Date(b.earliest);
    });
  }

  function currentWeekGames(){
    // Every game whose sport+week is currently "visible" per isWeekVisible()
    // -- the commissioner's manual override if one was set for that
    // sport+week, else the automatic current-week-by-date rule. This is the
    // single definition of "this week" shared by the This Week tab and the
    // compliance report, so toggling a week's visibility moves both together.
    return state.games.filter(function(g){ return g.kickoff && isWeekVisible(g.sport, g.week); });
  }

  function currentWeekLabel(games){
    var labels = {};
    games.forEach(function(g){ labels[g.sport + ' — ' + g.week] = true; });
    var keys = Object.keys(labels).sort();
    return keys.length ? keys.join(' / ') : null;
  }

  function startOfWeekBalance(name, weekStart, gameIds){
    // The balance a player had the moment this week's games began -- i.e.
    // their running balance BEFORE any of this week's results (or, since
    // they haven't happened yet in the normal case, before this week could
    // have affected it at all). Built the same way playerStats() builds the
    // current balance, but wagers on this week's own games are excluded
    // entirely (win, loss, or still pending -- none of them happened yet as
    // of the start of the week), and commissioner adjustments made during
    // the week itself don't count toward it either.
    var net = 0;
    state.wagers.forEach(function(w){
      if(w.player !== name || gameIds[w.gameId]) return;
      var g = gameById(w.gameId);
      var r = wagerResult(w, g);
      if(r === 'win') net += w.points;
      else if(r === 'loss') net -= w.points;
    });
    var adj = 0;
    state.adjustments.forEach(function(a){
      if(a.player !== name) return;
      if(weekStart && a.ts >= weekStart.getTime()) return;
      adj += a.amount;
    });
    return state.startingBalance + net + adj;
  }

  function weekStartBalanceForGame(name, g){
    // Same "balance at the start of the week" startOfWeekBalance computes
    // for the compliance report, but scoped to whichever week this specific
    // game belongs to -- this is the ceiling on a single wager: a player
    // can't put more points on one pick than they had to their name before
    // this week's own results could have moved that balance at all.
    var weekGames = state.games.filter(function(wg){ return wg.sport === g.sport && wg.week === g.week; });
    var gameIds = {};
    weekGames.forEach(function(wg){ gameIds[wg.id] = true; });
    var kickoffs = weekGames.filter(function(wg){ return wg.kickoff; }).map(function(wg){ return new Date(wg.kickoff); });
    var weekStart = kickoffs.length ? tuesdayWindowStart(kickoffs.reduce(function(a,b){ return b < a ? b : a; })) : null;
    return startOfWeekBalance(name, weekStart, gameIds);
  }

  function halfPointsReport(){
    // Flags every roster member whose TOTAL points wagered across this
    // week's games (ATS + O/U combined, any sport) falls short of half the
    // balance they had STARTING this week -- not their current balance,
    // which this week's own (still-pending, or just-settled) results
    // shouldn't be allowed to move the bar on.
    var games = currentWeekGames();
    var gameIds = {};
    games.forEach(function(g){ gameIds[g.id] = true; });
    var weekStart = null;
    var kickoffs = games.filter(function(g){ return g.kickoff; }).map(function(g){ return new Date(g.kickoff); });
    if(kickoffs.length){
      var earliest = kickoffs.reduce(function(a,b){ return b < a ? b : a; });
      weekStart = tuesdayWindowStart(earliest);
    }
    return rosterUsernames().map(function(name){
      var balance = startOfWeekBalance(name, weekStart, gameIds);
      var wagered = state.wagers.filter(function(w){ return w.player === name && gameIds[w.gameId]; })
        .reduce(function(sum, w){ return sum + w.points; }, 0);
      var required = balance / 2;
      return {
        player: name,
        team: displayName(name),
        balance: balance,
        required: required,
        wagered: wagered,
        shortBy: Math.max(0, required - wagered)
      };
    }).filter(function(r){ return r.wagered < r.required; })
      .sort(function(a,b){ return b.shortBy - a.shortBy; });
  }

  function fmtHalf(n){
    var v = Math.round(n*10)/10;
    return Number.isInteger(v) ? String(v) : v.toFixed(1);
  }

  function weekVisibilityToggle(active, sport, week, value, label){
    return '<button type="button" class="btn' + (active ? '' : ' ghost') + '" data-action="set-week-visibility" data-sport="' + esc(sport) + '" data-week="' + esc(week) + '" data-value="' + value + '">' + label + '</button>';
  }

  function renderWeekVisibilityCard(){
    // Lets the commissioner decide exactly when each week's games appear on
    // the This Week tab, instead of it always being driven purely by kickoff
    // dates. "Auto" (the default for any week never touched here) keeps the
    // original current-week-by-date behavior; Show/Hide are explicit
    // overrides that win regardless of date. See isWeekVisible().
    var groups = allSportWeeks();
    var head = '<div class="section-title"><h3>Week visibility</h3></div>';
    if(!groups.length){
      return '<div class="card">' + head + '<div class="empty" style="border:none">No games with a kickoff yet — sync in odds first.</div></div>';
    }
    var sub = '<p class="eyebrow" style="margin:-6px 0 12px">Choose when each week\'s games show up on the This Week tab. "Auto" follows the usual current-week-by-date rule.</p>';
    var rows = groups.map(function(grp){
      var key = weekKey(grp.sport, grp.week);
      var override = Object.prototype.hasOwnProperty.call(state.weekVisibility, key) ? state.weekVisibility[key] : null;
      var effective = isWeekVisible(grp.sport, grp.week);
      var stateLabel = override === true ? 'Shown (manual)' : override === false ? 'Hidden (manual)' : (effective ? 'Shown (auto)' : 'Hidden (auto)');
      var buttons = weekVisibilityToggle(override === true, grp.sport, grp.week, 'show', 'Show') +
        weekVisibilityToggle(override === false, grp.sport, grp.week, 'hide', 'Hide') +
        weekVisibilityToggle(override === null, grp.sport, grp.week, 'auto', 'Auto');
      return '<tr><td>' + esc(grp.sport) + ' — ' + esc(grp.week) + '</td>' +
        '<td class="eyebrow">' + stateLabel + '</td>' +
        '<td class="num"><div style="display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap">' + buttons + '</div></td></tr>';
    }).join('');
    return '<div class="card">' + head + sub + '<div class="table-wrap"><table class="board"><thead><tr><th>Week</th><th>Status</th><th class="num">Set</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  }

  function renderComplianceCard(){
    var games = currentWeekGames();
    var label = currentWeekLabel(games);
    var rows = halfPointsReport();
    var head = '<div class="section-title"><h3>Under-wagered this week</h3></div>';
    if(!label){
      return '<div class="card">' + head + '<div class="empty" style="border:none">No games are scheduled yet, so there\'s no current week to check.</div></div>';
    }
    var sub = '<p class="eyebrow" style="margin:-6px 0 12px">Current week: ' + esc(label) + ' &middot; flags anyone whose total points wagered across this week\'s games is under half the balance they had starting this week</p>';
    if(!rows.length){
      return '<div class="card">' + head + sub + '<div class="empty" style="border:none">Everyone has wagered at least half their points this week.</div></div>';
    }
    // halfPointsReport() itself always returns most-short-first -- re-sort
    // here so the Status column header can flip the direction without
    // touching the report's own default ordering for anything else.
    rows = rows.slice().sort(function(a, b){
      return view.complianceSortAsc ? (a.shortBy - b.shortBy) : (b.shortBy - a.shortBy);
    });
    var body = rows.map(function(r){
      return '<tr><td>' + esc(r.team) + '</td><td class="num mono">' + r.balance + '</td><td class="num mono">' + fmtHalf(r.required) + '</td><td class="num mono">' + r.wagered + '</td><td class="num"><span class="result-pill loss">short ' + fmtHalf(r.shortBy) + '</span></td></tr>';
    }).join('');
    var sortArrow = view.complianceSortAsc ? '▲' : '▼';
    var statusHeader = '<th class="num"><button type="button" class="sortable-th" data-action="toggle-compliance-sort">Status ' + sortArrow + '</button></th>';
    return '<div class="card">' + head + sub + '<div class="table-wrap"><table class="board"><thead><tr><th>Team</th><th class="num">Week-start balance</th><th class="num">Half</th><th class="num">Wagered</th>' + statusHeader + '</tr></thead><tbody>' + body + '</tbody></table></div></div>';
  }

  function renderBalanceAdjustCard(){
    // Lets the commissioner nudge a player's balance directly -- a bonus, a
    // correction, or a penalty that falls outside normal ATS/O/U wagering.
    // Stored as its own ledger of adjustments (rather than mutating a single
    // "balance" field) so every change stays auditable and playerStats() can
    // keep computing balance from history, the same way it already does for
    // wins and losses.
    var head = '<div class="section-title"><h3>Adjust a player\'s balance</h3></div>';
    var keys = rosterUsernames();
    if(!keys.length){
      return '<div class="card">' + head + '<div class="empty" style="border:none">No players on the roster yet.</div></div>';
    }
    var options = keys.map(function(k){ return '<option value="' + esc(k) + '">' + esc(displayName(k)) + '</option>'; }).join('');
    var sub = '<p class="eyebrow" style="margin:-6px 0 12px">Adds points to a player\'s balance -- use a minus sign to subtract instead.</p>';
    var form = '<form class="panel" data-action="adjust-balance">' +
      '<div class="grid3">' +
        '<div class="field"><label>Player</label><select name="player">' + options + '</select></div>' +
        '<div class="field"><label>Amount (+/-)</label><input class="mono" type="number" step="1" name="amount" placeholder="e.g. 100 or -50" required></div>' +
        '<div class="field"><label>Note (optional)</label><input name="note" placeholder="Reason for this adjustment"></div>' +
      '</div>' +
      '<div class="pick-actions"><button class="btn" type="submit">Apply adjustment</button></div>' +
      '</form>';
    var log = '';
    if(state.adjustments.length){
      var rows = state.adjustments.slice().sort(function(a,b){ return b.ts - a.ts; }).map(function(a){
        var amt = (a.amount > 0 ? '+' : '') + a.amount;
        var color = a.amount > 0 ? 'var(--win)' : (a.amount < 0 ? 'var(--loss)' : 'var(--text)');
        return '<tr><td>' + esc(displayName(a.player)) + '</td><td class="num mono" style="color:' + color + '">' + amt + '</td><td>' + esc(a.note || '—') + '</td></tr>';
      }).join('');
      log = '<div class="table-wrap" style="margin-top:14px"><table class="board"><thead><tr><th>Player</th><th class="num">Amount</th><th>Note</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    }
    return '<div class="card">' + head + sub + form + log + '</div>';
  }

  function renderVoidPicksCard(){
    // Lets the commissioner remove any single wager outright -- a wrong
    // pick, a rule violation, a technical mix-up, whatever. Wagers aren't
    // tallied anywhere except state.wagers itself (playerStats() recomputes
    // balance/W-L from it every render), so deleting the entry is the whole
    // operation -- nothing else needs reconciling afterward.
    var head = '<div class="section-title"><h3>Void a pick</h3></div>';
    if(!state.wagers.length){
      return '<div class="card">' + head + '<div class="empty" style="border:none">No picks have been made yet.</div></div>';
    }
    var sub = '<p class="eyebrow" style="margin:-6px 0 12px">Removes a wager entirely — balance and win/loss records update automatically once it\'s gone. This can\'t be undone. The side/pick itself isn\'t shown here, so voiding decisions never depend on what was picked.</p>';
    // Only players who currently have at least one wager are worth listing
    // in the filter -- anyone else would just filter down to an empty table.
    var playersWithWagers = [];
    var seenPlayers = {};
    state.wagers.forEach(function(w){
      if(!seenPlayers[w.player]){ seenPlayers[w.player] = true; playersWithWagers.push(w.player); }
    });
    playersWithWagers.sort(function(a, b){ return displayName(a).localeCompare(displayName(b)); });
    var activeFilter = seenPlayers[view.voidPickFilter] ? view.voidPickFilter : '';
    var filterOptions = playersWithWagers.map(function(p){
      return '<option value="' + esc(p) + '" ' + (activeFilter === p ? 'selected' : '') + '>' + esc(displayName(p)) + '</option>';
    }).join('');
    var filter = '<div class="field" style="max-width:280px;margin-bottom:12px"><label>Filter by player</label><select data-action="filter-void-player"><option value="">All players</option>' + filterOptions + '</select></div>';
    var visibleWagers = activeFilter ? state.wagers.filter(function(w){ return w.player === activeFilter; }) : state.wagers;
    if(!visibleWagers.length){
      return '<div class="card">' + head + sub + filter + '<div class="empty" style="border:none">No picks for this player.</div></div>';
    }
    var rows = visibleWagers.slice().sort(function(a, b){
      var byName = displayName(a.player).localeCompare(displayName(b.player));
      if(byName) return byName;
      return (b.id || '').localeCompare(a.id || '');
    }).map(function(w){
      var g = gameById(w.gameId);
      var matchup = g ? (esc(g.away) + ' @ ' + esc(g.home)) : '<em>(deleted game)</em>';
      var meta = g ? (esc(g.sport) + ' · ' + esc(g.week)) : '';
      // The actual side/pick is deliberately NOT shown here -- the
      // commissioner has everything needed to identify and void the right
      // wager (player, game, market, points) without seeing what was picked.
      var result = wagerResult(w, g);
      return '<tr><td>' + esc(displayName(w.player)) + '</td>' +
        '<td>' + matchup + '<div class="eyebrow">' + meta + '</div></td>' +
        '<td>' + esc(w.type) + '</td>' +
        '<td class="num mono">' + w.points + '</td>' +
        '<td class="num"><span class="result-pill ' + result + '">' + result + '</span></td>' +
        '<td class="num"><button type="button" class="btn danger" data-action="void-pick" data-wager="' + w.id + '">Void</button></td>' +
        '</tr>';
    }).join('');
    var table = '<div class="table-wrap"><table class="board"><thead><tr><th>Player</th><th>Game</th><th>Type</th><th class="num">Pts</th><th class="num">Result</th><th class="num"></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    return '<div class="card">' + head + sub + filter + table + '</div>';
  }

  function renderRosterBackupCard(){
    // A safety net independent of the live artifact's own version history:
    // downloads a snapshot of every account's profile info (never raw
    // passwords or even their hashes/salts -- those never leave the page)
    // so the commissioner has an off-artifact copy of the roster on hand.
    var head = '<div class="section-title"><h3>Backup roster</h3></div>';
    if(!state.players.length){
      return '<div class="card">' + head + '<div class="empty" style="border:none">No accounts have signed up yet.</div></div>';
    }
    var sub = '<p class="eyebrow" style="margin:-6px 0 12px">Downloads everyone\'s account info (usernames, names, emails, signup dates) as a JSON file -- never passwords, which are only ever stored as salted hashes. Keep this somewhere safe as a backup.</p>';
    var btn = '<div class="pick-actions"><button type="button" class="btn ghost" data-action="download-roster-backup">Download roster backup (' + state.players.length + ' account' + (state.players.length===1?'':'s') + ')</button></div>';
    return '<div class="card">' + head + sub + btn + '</div>';
  }

  function renderBootPlayerCard(){
    // Removes a player entirely -- their account AND every wager they've
    // ever placed, so they disappear from the leaderboard, All Picks, Void
    // a Pick, and the compliance report alike, not just the login.
    var head = '<div class="section-title"><h3>Boot a player</h3></div>';
    if(!state.players.length){
      return '<div class="card">' + head + '<div class="empty" style="border:none">No accounts have signed up yet.</div></div>';
    }
    var sub = '<p class="eyebrow" style="margin:-6px 0 12px">Removes a player\'s login AND every wager they\'ve ever placed — they disappear from the leaderboard, All Picks, and every other report. They\'re logged out immediately and can\'t log back in unless they sign up again. This can\'t be undone.</p>';
    var rows = state.players.slice().sort(function(a, b){ return a.teamName.localeCompare(b.teamName); }).map(function(p){
      return '<tr><td>' + esc(p.teamName) + '</td><td class="eyebrow">' + esc(p.username) + '</td>' +
        '<td class="num"><button type="button" class="btn danger" data-action="boot-player" data-player="' + esc(p.username) + '">Boot</button></td></tr>';
    }).join('');
    var table = '<div class="table-wrap"><table class="board"><thead><tr><th>Team</th><th>Username</th><th class="num"></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    return '<div class="card">' + head + sub + table + '</div>';
  }

  // ---------- persistence ----------
  function toast(msg, ms){
    var root = document.getElementById('toast-root');
    if(!root) return;
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(function(){ el.remove(); }, ms || 3400);
  }

  // Layers players/wagers created locally but not yet confirmed saved
  // (see pendingAdditions) on top of a fresh copy of state fetched from
  // the server, so a signup or a pick made just before the initial load
  // resolves -- or one that lost a save-conflict race -- doesn't just
  // vanish the moment the server's copy replaces the local one.
  function applyPendingAdditions(remote){
    var remoteUsernames = {};
    remote.players.forEach(function(p){ remoteUsernames[p.username] = true; });
    pendingAdditions.players.forEach(function(p){
      if(!remoteUsernames[p.username]){ remote.players.push(p); remoteUsernames[p.username] = true; }
    });
    var remoteWagerIds = {};
    remote.wagers.forEach(function(w){ remoteWagerIds[w.id] = true; });
    pendingAdditions.wagers.forEach(function(w){
      if(!remoteWagerIds[w.id]){ remote.wagers.push(w); remoteWagerIds[w.id] = true; }
    });
    return remote;
  }

  var saving = false;
  function save(successMsg, retriesLeft){
    render();
    if(retriesLeft === undefined) retriesLeft = 2;
    if(serverVersion === null){
      if(!warnedNoCap){ warnedNoCap = true; toast('Live saving isn\'t available right now — changes will only last this session.', 4500); }
      return Promise.resolve(false);
    }
    if(saving) return Promise.resolve(false);
    saving = true;
    return fetch('api.php?action=save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ version: serverVersion, key: SAVE_KEY, data: state })
    }).then(function(res){
      return res.json().then(function(body){ return { status: res.status, body: body }; });
    }).then(function(result){
      saving = false;
      if(result.status === 200){
        serverVersion = result.body.version;
        pendingAdditions = { players: [], wagers: [] };
        if(successMsg) toast(successMsg);
        return true;
      }
      if(result.status === 409){
        // Someone else saved since we last loaded -- rebase onto their
        // version instead of clobbering it, but replay anything of ours
        // that hasn't been confirmed saved yet (a signup, a pick) so it
        // isn't silently lost, then retry a bounded number of times in
        // case of a fast back-to-back conflict.
        state = applyPendingAdditions(normalizeState(result.body.data));
        serverVersion = result.body.version;
        render();
        if(retriesLeft > 0){
          return save(successMsg, retriesLeft - 1);
        }
        toast('Someone else just saved a change — reloading with the latest board…');
        return false;
      }
      toast('Could not save that just now — please try again.');
      return false;
    }).catch(function(){
      saving = false;
      toast('Could not save that just now — please try again.');
      return false;
    });
  }

  }

  function renderWeekTab(){
    var allGames = sortedGames();
    var authHtml = currentPlayer ? '' : renderAuthPanel();
    if(!allGames.length){
      return authHtml + '<div class="empty">No games on the board yet.<br>Head to the <strong>Commissioner</strong> tab to sync in this week\'s odds.</div>';
    }
    // Which week(s) show here is controlled per sport+week by the
    // commissioner's Week visibility tool (Commissioner tab) -- defaulting,
    // for any week not explicitly toggled, to the same "current week by
    // kickoff date, per sport" rule this always used (see isWeekVisible()).
    // Older and future weeks still show up in All Picks and the Leaderboard;
    // this tab is just "what to pick right now."
    // A game with no kickoff set at all can't be placed in any date window,
    // so it always shows here rather than silently vanishing -- the
    // commissioner added it without a time for a reason.
    var games = allGames.filter(function(g){ return !g.kickoff || isWeekVisible(g.sport, g.week); });
    if(view.sportFilter) games = games.filter(function(g){ return g.sport === view.sportFilter; });
    var label = currentWeekLabel(games);
    // A game drops off This Week the moment it locks (kickoff has passed, or
    // it's been marked final) -- this tab is only for games still open to
    // pick. The toggle below is an opt-in way to still glance back at a
    // locked game (e.g. to double check a pick) without it cluttering the
    // default view.
    var visible = games.filter(function(g){ return view.showCompleted || !isLocked(g); });
    var groups = [];
    var byKey = {};
    visible.forEach(function(g){
      var key = g.sport + '|' + g.week;
      if(!byKey[key]){ byKey[key] = { label: g.sport + ' — ' + g.week, items: [] }; groups.push(byKey[key]); }
      byKey[key].items.push(g);
    });
    var sportFilterButtons = '<div class="sport-filter">' + [['', 'All'], ['NFL', 'NFL'], ['NCAAF', 'NCAAF']].map(function(s){
      return '<button type="button" class="' + (view.sportFilter === s[0] ? 'active' : '') + '" data-action="set-sport-filter" data-sport="' + s[0] + '">' + s[1] + '</button>';
    }).join('') + '</div>';
    var toolbar = '<div class="toolbar"><span class="eyebrow">' + (label ? 'Showing ' + esc(label) : 'Current week') + '</span>' + sportFilterButtons + '<label class="toggle"><input type="checkbox" data-action="toggle-completed" ' + (view.showCompleted?'checked':'') + '> Show locked games</label></div>';
    var html = authHtml + toolbar;
    if(!games.length){
      html += '<div class="empty">No games scheduled for the current week yet.<br>Check the <strong>All Picks</strong> tab for other weeks, or the Commissioner tab to add matchups.</div>';
      return html;
    }
    if(!visible.length){
      html += '<div class="empty">Every game this week has locked. Toggle "show locked games" above to review them, or check the All Picks tab.</div>';
    }
    groups.forEach(function(grp){
      html += '<div class="week-head"><h2>' + esc(grp.label) + '</h2></div>';
      grp.items.forEach(function(g){ html += renderGameCard(g); });
    });
    return html;
  }

  function isLocked(g){
    if(g.status === 'final') return true;
    if(g.kickoff){ return Date.now() >= new Date(g.kickoff).getTime(); }
    return false;
  }

  function earliestWageredKickoff(player, sport, week){
    // Among this player's wagers (ATS or O/U, any game) within one sport's
    // week, returns the earliest kickoff time they've already staked a pick
    // on -- or null if they haven't wagered on anything in that week yet.
    var wageredGameIds = {};
    state.wagers.forEach(function(w){ if(w.player === player) wageredGameIds[w.gameId] = true; });
    var kickoffs = state.games
      .filter(function(g){ return g.sport === sport && g.week === week && g.kickoff && wageredGameIds[g.id]; })
      .map(function(g){ return new Date(g.kickoff).getTime(); });
    return kickoffs.length ? Math.min.apply(null, kickoffs) : null;
  }

  function isWeekLockedForPlayer(g, player){
    // Once a player's earliest-wagered game of the week has kicked off, they
    // can no longer place or change picks on any OTHER game that week --
    // even ones that haven't started yet -- so nobody can sandbag late games
    // after watching how their early ones turn out. A game that's already
    // locked on its own merits (isLocked) doesn't need this check.
    if(!player) return false;
    var earliest = earliestWageredKickoff(player, g.sport, g.week);
    return earliest !== null && Date.now() >= earliest;
  }

  function renderGameCard(g){
    var homeLine = g.favorite === 'home' ? -g.spread : g.spread;
    var awayLine = g.favorite === 'away' ? -g.spread : g.spread;
    var locked = isLocked(g);
    var kickoffStr = g.kickoff ? new Date(g.kickoff).toLocaleString(undefined, {weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : 'Kickoff TBD';
    var head = '<div class="g-head"><span class="eyebrow">' + esc(g.sport) + ' · ' + esc(kickoffStr) + '</span><div class="lines"><span class="chip">O/U ' + fmtNum(g.total) + '</span><span class="status-badge ' + (g.status==='final'?'final':'') + '">' + (g.status==='final' ? 'Final' : (locked ? 'Locked' : 'Open')) + '</span></div></div>';

    var matchup = '<div class="matchup">' +
      '<div class="team"><div class="tname">' + esc(g.away) + (g.status==='final' ? ' <span class="tscore mono">' + g.finalAway + '</span>' : '') + '</div><div class="tline mono">' + fmtLine(awayLine) + '</div></div>' +
      '<div class="vs">AT</div>' +
      '<div class="team" style="text-align:right"><div class="tname">' + esc(g.home) + (g.status==='final' ? ' <span class="tscore mono">' + g.finalHome + '</span>' : '') + '</div><div class="tline mono">' + fmtLine(homeLine) + '</div></div>' +
      '</div>';

    var body;
    var weekLocked = currentPlayer && !locked ? isWeekLockedForPlayer(g, currentPlayer) : false;
    if(!currentPlayer){
      body = '<div class="recap"><span class="eyebrow">Log in or create an account above to make picks on this game.</span></div>';
    } else if(locked || weekLocked){
      var ats = playerWager(g.id, currentPlayer, 'ATS');
      var ou = playerWager(g.id, currentPlayer, 'OU');
      var gr = gameResult(g);
      body = '<div class="recap">';
      if(ats){
        var atsRes = wagerResult(ats, g);
        body += '<div class="recap-row"><span>ATS — ' + esc(ats.pick==='home'?g.home:g.away) + ' ' + fmtLine(ats.pick==='home'?homeLine:awayLine) + ' for ' + ats.points + ' pts</span><span class="result-pill ' + atsRes + '">' + atsRes + '</span></div>';
      }
      if(ou){
        var ouRes = wagerResult(ou, g);
        body += '<div class="recap-row"><span>O/U — ' + esc(ou.pick==='over'?'Over':'Under') + ' ' + fmtNum(g.total) + ' for ' + ou.points + ' pts</span><span class="result-pill ' + ouRes + '">' + ouRes + '</span></div>';
      }
      if(!ats && !ou) body += '<span class="eyebrow">' + (weekLocked ? 'No pick was made before your first wagered game of the week kicked off.' : 'No pick made before this game locked.') + '</span>';
      if(weekLocked) body += '<div class="recap-row"><span class="eyebrow">Picks for ' + esc(g.sport) + ' — ' + esc(g.week) + ' are locked for you — your first wagered game of the week already kicked off.</span></div>';
      body += '</div>';
    } else {
      // Once a market (ATS or OU) has been submitted, it's locked in for good --
      // no more editing, even while the game is still open. Each market is
      // independent: submitting ATS doesn't touch whether OU can still be
      // picked, and vice versa. A submitted market renders as a read-only
      // recap row (same look as a fully locked game); an un-submitted market
      // still renders its editable radio + points input.
      var atsW = playerWager(g.id, currentPlayer, 'ATS');
      var ouW = playerWager(g.id, currentPlayer, 'OU');
      var lockedRows = '';
      if(atsW){
        var atsResOpen = wagerResult(atsW, g);
        lockedRows += '<div class="recap-row"><span>ATS — ' + esc(atsW.pick==='home'?g.home:g.away) + ' ' + fmtLine(atsW.pick==='home'?homeLine:awayLine) + ' for ' + atsW.points + ' pts</span><span class="result-pill ' + atsResOpen + '">' + atsResOpen + '</span></div>';
      }
      if(ouW){
        var ouResOpen = wagerResult(ouW, g);
        lockedRows += '<div class="recap-row"><span>O/U — ' + esc(ouW.pick==='over'?'Over':'Under') + ' ' + fmtNum(g.total) + ' for ' + ouW.points + ' pts</span><span class="result-pill ' + ouResOpen + '">' + ouResOpen + '</span></div>';
      }
      var lockedBlock = lockedRows ? '<div class="recap">' + lockedRows + '<span class="eyebrow">Submitted picks are locked in and can\'t be changed.</span></div>' : '';

      // Can't wager more on a single pick than the balance this player had
      // at the start of the week -- see weekStartBalanceForGame().
      var maxWager = weekStartBalanceForGame(currentPlayer, g);
      var openBlocks = '';
      if(!atsW){
        openBlocks += '<div class="pick-block"><span class="label">ATS</span>' +
          '<label class="opt"><input type="radio" name="ats-pick" value="away"> ' + esc(g.away) + ' ' + fmtLine(awayLine) + '</label>' +
          '<label class="opt"><input type="radio" name="ats-pick" value="home"> ' + esc(g.home) + ' ' + fmtLine(homeLine) + '</label>' +
          '<input class="pts-input" type="number" min="' + MIN_WAGER + '" max="' + maxWager + '" step="1" name="ats-points" placeholder="pts">' +
          '</div>';
      }
      if(!ouW){
        openBlocks += '<div class="pick-block"><span class="label">O/U</span>' +
          '<label class="opt"><input type="radio" name="ou-pick" value="over"> Over ' + fmtNum(g.total) + '</label>' +
          '<label class="opt"><input type="radio" name="ou-pick" value="under"> Under ' + fmtNum(g.total) + '</label>' +
          '<input class="pts-input" type="number" min="' + MIN_WAGER + '" max="' + maxWager + '" step="1" name="ou-points" placeholder="pts">' +
          '</div>';
      }
      // novalidate so the browser's own constraint bubble never pre-empts
      // our own "You must wager at least MIN_WAGER points." popup below.
      var formBlock = openBlocks ? '<form class="pick-form" data-action="save-picks" data-game="' + g.id + '" novalidate>' + openBlocks + '<p class="eyebrow" style="margin:6px 0 0">Picks lock in once submitted and can\'t be changed. Max wager: ' + fmtNum(maxWager) + ' pts (your balance at the start of the week).</p><div class="pick-actions"><button class="btn" type="submit">Save picks</button></div></form>' : '';

      body = lockedBlock + formBlock;
    }

    return '<div class="card game-card">' + head + matchup + body + '</div>';
  }

  function renderLeaderboardTab(){
    var keys = rosterUsernames();
    if(!keys.length){
      return '<div class="empty">No one\'s on the board yet. Once players make picks (or the commissioner adds them), standings show up here.</div>';
    }
    var rows = keys.map(function(k){ return { key:k, stats: playerStats(k) }; });
    rows.sort(function(a,b){ return b.stats.balance - a.stats.balance; });
    var body = rows.map(function(r, i){
      var d = r.stats.balance - state.startingBalance;
      var nameCell = '<button type="button" class="player-link" data-action="view-player" data-player="' + esc(r.key) + '">' + esc(displayName(r.key)) + '</button>' + (r.key===currentPlayer?' <span class="eyebrow">(you)</span>':'');
      return '<tr><td class="rank ' + (i===0?'top':'') + '">' + (i+1) + '</td><td>' + nameCell + '</td><td class="num mono">' + r.stats.wins + '-' + r.stats.losses + '-' + r.stats.pushes + '</td><td class="num mono" style="color:' + (d>0?'var(--win)':d<0?'var(--loss)':'var(--text)') + '">' + r.stats.balance + '</td></tr>';
    }).join('');
    var html = '<div class="card"><div class="table-wrap"><table class="board"><thead><tr><th>#</th><th>Player</th><th class="num">W-L-P</th><th class="num">Balance</th></tr></thead><tbody>' + body + '</tbody></table></div></div>' +
      '<div class="eyebrow" style="text-align:center">Everyone starts at ' + state.startingBalance + ' pts</div>' +
      '<p class="eyebrow" style="text-align:center">Click a player\'s name to see picks on games that have kicked off</p>';
    if(view.viewingPlayer && keys.indexOf(view.viewingPlayer) !== -1){
      html += renderPlayerPicksCard(view.viewingPlayer);

    return html;
  }

  function renderPlayerPicksCard(username){
    // Anyone can drill into any player's picks from the leaderboard, but only
    // for games that have already kicked off (or gone final) -- same privacy
    // boundary as the All Picks tab, so this never leaks a still-open pick.
    var name = displayName(username);
    var wagers = state.wagers.filter(function(w){
      if(w.player !== username) return false;
      var g = gameById(w.gameId);
      return g && isLocked(g);
    });
    var head = '<div class="section-title" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h3>' + esc(name) + '’s picks</h3><button type="button" class="btn ghost" data-action="close-player-picks">Close</button></div>';
    if(!wagers.length){
      return '<div class="card">' + head + '<div class="empty" style="border:none">No picks yet on games that have started.</div></div>';
    }
    wagers = wagers.slice().sort(function(a,b){
      var ga = gameById(a.gameId), gb = gameById(b.gameId);
      var ka = ga && ga.kickoff ? new Date(ga.kickoff).getTime() : 0;
      var kb = gb && gb.kickoff ? new Date(gb.kickoff).getTime() : 0;
      return kb - ka;
    });
    var rows = wagers.map(function(w){
      var g = gameById(w.gameId);
      var res = wagerResult(w, g);
      var pickLabel = w.type === 'ATS' ? (w.pick==='home'?g.home:g.away) : (w.pick==='over'?'Over':'Under') + ' ' + fmtNum(g.total);
      var matchup = '<div>' + esc(g.away) + ' @ ' + esc(g.home) + '</div><div class="eyebrow" style="margin-top:2px">' + esc(g.sport) + ' · ' + esc(g.week) + '</div>';
      return '<tr><td>' + matchup + '</td><td class="eyebrow">' + w.type + '</td><td>' + esc(pickLabel) + '</td><td class="num mono">' + w.points + '</td><td class="num"><span class="result-pill ' + res + '">' + res + '</span></td></tr>';
    }).join('');
    return '<div class="card">' + head + '<div class="table-wrap"><table class="board"><thead><tr><th>Game</th><th>Type</th><th>Pick</th><th class="num">Pts</th><th class="num">Result</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  }

  function renderPicksTab(){
    var games = sortedGames();
    if(!state.wagers.length){
      return '<div class="empty">No picks placed yet.</div>';
    }
    function rowsFor(list, g){
      return list.slice().sort(function(a,b){ return displayName(a.player).localeCompare(displayName(b.player)); }).map(function(w){
        var res = wagerResult(w, g);
        var pickLabel = w.type === 'ATS' ? (w.pick==='home'?g.home:g.away) : (w.pick==='over'?'Over':'Under') + ' ' + fmtNum(g.total);
        return '<tr><td>' + esc(displayName(w.player)) + '</td><td class="eyebrow">' + w.type + '</td><td>' + esc(pickLabel) + '</td><td class="num mono">' + w.points + '</td><td class="num"><span class="result-pill ' + res + '">' + res + '</span></td></tr>';
      }).join('');
    }
    function table(rowsHtml){
      return '<div class="table-wrap"><table class="board"><thead><tr><th>Player</th><th>Type</th><th>Pick</th><th class="num">Pts</th><th class="num">Result</th></tr></thead><tbody>' + rowsHtml + '</tbody></table></div>';
    }
    // Future (not-yet-started) games never show per-game detail here -- not
    // even to the picks' own player -- since which specific game a count
    // comes from would start to reveal what was picked. Instead, tally a
    // simple count of pending picks per player across every future game,
    // with no game names or pick details attached to it.
    var futureCounts = {};
    var futureOrder = [];
    state.wagers.forEach(function(w){
      var g = gameById(w.gameId);
      if(!g || isLocked(g)) return;
      if(futureCounts[w.player] === undefined){ futureCounts[w.player] = 0; futureOrder.push(w.player); }
      futureCounts[w.player]++;
    });
    var futureSection = '';
    if(futureOrder.length){
      var futureRows = futureOrder.slice().sort(function(a,b){ return displayName(a).localeCompare(displayName(b)); })
        .map(function(p){ return '<tr><td>' + esc(displayName(p)) + '</td><td class="num mono">' + futureCounts[p] + '</td></tr>'; }).join('');
      futureSection = '<div class="card"><div class="section-title"><h3>Future picks</h3><p class="eyebrow" style="margin:4px 0 0">How many picks each player has made on games that haven\'t started yet — not which games or what they picked.</p></div>' +
        '<div class="table-wrap"><table class="board"><thead><tr><th>Player</th><th class="num">Picks pending</th></tr></thead><tbody>' + futureRows + '</tbody></table></div></div>';
    }

    var html = '';
    games.forEach(function(g){
      if(!isLocked(g)) return;
      var ws = state.wagers.filter(function(w){ return w.gameId === g.id; });
      if(!ws.length) return;
      var title = '<div class="section-title"><h3>' + esc(g.away) + ' @ ' + esc(g.home) + '<span class="eyebrow" style="margin-left:8px">' + esc(g.sport) + ' · ' + esc(g.week) + '</span></h3></div>';
      html += '<div class="card">' + title + table(rowsFor(ws, g)) + '</div>';
    });
    html = futureSection + html;
    return html || '<div class="empty">No picks placed yet.</div>';
  }

        state.players = state.players.filter(function(p){ return p.username !== bootUsername; });
        state.wagers = state.wagers.filter(function(w){ return w.player !== bootUsername; });

  document.addEventListener('submit', function(e){
    var form = e.target.closest('[data-action]');
    if(!form) return;
    e.preventDefault();
    var action = form.getAttribute('data-action');
    var fd = new FormData(form);

    if(action === 'signup'){
      var suUsername = normalizeUsername(fd.get('username'));
      var suTeamName = String(fd.get('teamName')||'').trim();
      var suFirstName = String(fd.get('firstName')||'').trim();
      var suLastName = String(fd.get('lastName')||'').trim();
      var suEmail = String(fd.get('email')||'').trim();
      var suPassword = String(fd.get('password')||'');
      var suConfirm = String(fd.get('confirmPassword')||'');
      if(!suUsername || !suTeamName || !suFirstName || !suLastName || !suEmail || !suPassword){ toast('Please fill in every field.'); return; }
      if(!/^[a-z0-9_.-]{3,24}$/.test(suUsername)){ toast('Usernames: 3-24 characters, letters/numbers/._- only.'); return; }
      if(suPassword.length < 6){ toast('Password needs at least 6 characters.'); return; }
      if(suPassword !== suConfirm){ toast('Passwords don\'t match.'); return; }
      if(!/^\S+@\S+\.\S+$/.test(suEmail)){ toast('That doesn\'t look like a valid email address.'); return; }
      if(findPlayer(suUsername)){ toast('That username is taken — try another.'); return; }
      if(state.players.some(function(p){ return p.teamName.trim().toLowerCase() === suTeamName.toLowerCase(); })){ toast('That team name is already taken — try another.'); return; }
      hashNewPassword(suPassword).then(function(hashed){
        var newPlayer = {
          username: suUsername, salt: hashed.salt, passwordHash: hashed.hash,
          teamName: suTeamName, firstName: suFirstName, lastName: suLastName, email: suEmail,
          createdAt: new Date().toISOString()
        };
        state.players.push(newPlayer);
        pendingAdditions.players.push(newPlayer);
        currentPlayer = suUsername;
        try{ localStorage.setItem('poolUsername', suUsername); }catch(err){}
        save('Welcome to the pool, ' + suTeamName + '!');
      });
    } else if(action === 'login'){
      var liUsername = normalizeUsername(fd.get('username'));
      var liPassword = String(fd.get('password')||'');
      var profile = findPlayer(liUsername);
      if(!profile){ toast('No account with that username.'); return; }
      verifyPassword(liPassword, profile.salt, profile.passwordHash).then(function(ok){
        if(!ok){ toast('Wrong password.'); return; }
        currentPlayer = profile.username;
        try{ localStorage.setItem('poolUsername', profile.username); }catch(err){}
        render();
        toast('Welcome back, ' + profile.teamName + '.');
      });
    } else if(action === 'request-reset-code'){
      var rrUsername = normalizeUsername(fd.get('username'));
      var rrEmail = String(fd.get('email')||'').trim().toLowerCase();
      fetch('api.php?action=request-reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: rrUsername, email: rrEmail, key: SAVE_KEY })
      }).then(function(){
        view.resetRequestedUsername = rrUsername;
        render();
        toast('If that username and email match an account, a reset code has been emailed to it.', 5000);
      }).catch(function(){
        toast('Could not reach the server — please try again.');
      });
    } else if(action === 'complete-reset'){
      if(!view.resetRequestedUsername) return;
      var crCode = String(fd.get('code')||'').trim();
      var crPassword = String(fd.get('password')||'');
      var crConfirm = String(fd.get('confirmPassword')||'');
      if(crPassword.length < 6){ toast('Password needs at least 6 characters.'); return; }
      if(crPassword !== crConfirm){ toast('Passwords don\'t match.'); return; }
      var crUsername = view.resetRequestedUsername;
      hashNewPassword(crPassword).then(function(hashed){
        return fetch('api.php?action=complete-reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: crUsername, code: crCode, salt: hashed.salt, passwordHash: hashed.hash, key: SAVE_KEY })
        });
      }).then(function(res){
        return res.json().then(function(body){ return { status: res.status, body: body }; });
      }).then(function(result){
        if(result.status === 200){
          state = applyPendingAdditions(normalizeState(result.body.data));
          serverVersion = result.body.version;
          view.resetRequestedUsername = null;
          view.authMode = 'login';
          render();
          toast('Password reset — you can log in with your new password now.');
        } else {
          toast(result.body && result.body.error === 'invalid_code' ? 'That code is incorrect or has expired.' : 'Could not reset that password — please try again.');
        }
      }).catch(function(){
        toast('Could not reach the server — please try again.');
      });
    } else if(action === 'save-picks'){
      var gameId = form.getAttribute('data-game');
      var g = gameById(gameId);
      if(!g || !currentPlayer || isLocked(g)) return;
      // The form itself is only rendered while the player isn't week-locked,
      // but a stale render (this game's kickoff was still in the future when
      // the page last drew it, and their first wagered game of the week has
      // since kicked off) can still post here -- tell them why it didn't
      // save instead of silently doing nothing.
      if(isWeekLockedForPlayer(g, currentPlayer)){ toast('Your first game has kicked off already.'); return; }
      // Any market with a pick actually selected must wager at least
      // MIN_WAGER points -- check both markets before saving either, so a
      // too-small wager on one doesn't silently let the other through.
      var atsPickVal = fd.get('ats-pick');
      var ouPickVal = fd.get('ou-pick');
      var atsPointsVal = parseInt(fd.get('ats-points'), 10);
      var ouPointsVal = parseInt(fd.get('ou-points'), 10);
      if((atsPickVal && atsPointsVal < MIN_WAGER) || (ouPickVal && ouPointsVal < MIN_WAGER)){
        toast('You must wager at least ' + MIN_WAGER + ' points.');
        return;
      }
      // Can't wager more on a single pick than the balance this player had
      // at the start of the week -- checked server-side-of-the-form-handler
      // (not just the input's max attribute) in case a stale form still
      // posts a higher value.
      var maxWagerVal = weekStartBalanceForGame(currentPlayer, g);
      if((atsPickVal && atsPointsVal > maxWagerVal) || (ouPickVal && ouPointsVal > maxWagerVal)){
        toast('You can\'t wager more than ' + maxWagerVal + ' points — your balance at the start of the week.');
        return;
      }
      // Once a market has a submitted wager, it's final -- never overwrite an
      // existing pick, even if a stale form somehow still posts one (the UI
      // itself stops rendering an editable field for an already-submitted
      // market, but this guard is what actually enforces the rule).
      if(!playerWager(gameId, currentPlayer, 'ATS')) applyPick(gameId, 'ATS', atsPickVal, fd.get('ats-points'));
      if(!playerWager(gameId, currentPlayer, 'OU')) applyPick(gameId, 'OU', ouPickVal, fd.get('ou-points'));
      save('Picks saved.');
    } else if(action === 'admin-login'){
      var pin = String(fd.get('pin') || '').trim();
      if(pin === state.commissionerPin){
        view.isCommissioner = true;
        try{ localStorage.setItem('poolIsCommissioner', 'yes'); }catch(err){}
        render();
      } else {
        toast('Wrong PIN.');
      }
    } else if(action === 'save-game'){
      var editId = form.getAttribute('data-editing');
      var data = {
        sport: fd.get('sport'),
        week: String(fd.get('week')||'').trim() || 'Week 1',
        away: String(fd.get('away')||'').trim(),
        home: String(fd.get('home')||'').trim(),
        favorite: fd.get('favorite'),
        spread: Math.abs(parseFloat(fd.get('spread'))) || 0,
        total: parseFloat(fd.get('total')) || 0,
        kickoff: fd.get('kickoff') || null
      };
      if(!data.away || !data.home) return;
      if(editId){
        var g3 = gameById(editId);
        if(g3) Object.assign(g3, data);
        view.editingGameId = null;
        save('Game updated.');
      } else {
        data.id = uid();
        data.status = 'open';
        data.finalHome = null;
        data.finalAway = null;
        data.order = state.games.length;
        state.games.push(data);
        save('Game added.');
      }
    } else if(action === 'settle-game'){
      var gid2 = form.getAttribute('data-game');
      var g4 = gameById(gid2);
      var fa = parseInt(fd.get('finalAway'), 10);
      var fh = parseInt(fd.get('finalHome'), 10);
      if(!g4 || isNaN(fa) || isNaN(fh)) return;
      g4.finalAway = fa;
      g4.finalHome = fh;
      g4.status = 'final';
      save('Final score posted — results updated.');
    } else if(action === 'save-settings'){
      state.poolName = String(fd.get('poolName')||'').trim() || state.poolName;
      var sb = parseInt(fd.get('startingBalance'), 10);
      if(!isNaN(sb)) state.startingBalance = sb;
      var newPin = String(fd.get('commissionerPin')||'').trim();
      if(newPin) state.commissionerPin = newPin;
      document.title = state.poolName;
      save('Settings saved.');
    } else if(action === 'compose-email'){
      if(!view.isCommissioner) return;
      var recipients = playersWithEmail().map(function(p){ return p.email; });
      if(!recipients.length) return;
      var subject = String(fd.get('subject')||'').trim();
      var body = String(fd.get('body')||'');
      var mailto = 'mailto:?bcc=' + encodeURIComponent(recipients.join(',')) +
        '&subject=' + encodeURIComponent(subject) +
        '&body=' + encodeURIComponent(body);
      window.location.href = mailto;
    } else if(action === 'save-rules'){
      if(!view.isCommissioner) return;
      var rulesPin = String(fd.get('pin') || '').trim();
      if(rulesPin !== state.commissionerPin){ toast('Wrong PIN.'); return; }
      state.rulesText = String(fd.get('rulesText') || '');
      save('Rules saved.');
    } else if(action === 'adjust-balance'){
      if(!view.isCommissioner) return;
      var adjPlayer = String(fd.get('player') || '');
      var adjAmount = parseInt(fd.get('amount'), 10);
      var adjNote = String(fd.get('note') || '').trim();
      if(!adjPlayer || rosterUsernames().indexOf(adjPlayer) === -1 || !adjAmount) return;
      state.adjustments.push({ id: uid(), player: adjPlayer, amount: adjAmount, note: adjNote, ts: Date.now() });
      save('Adjusted ' + displayName(adjPlayer) + '\'s balance by ' + (adjAmount>0?'+':'') + adjAmount + '.');
    } else if(action === 'post-announcement'){
      if(!view.isCommissioner) return;
      var msg = String(fd.get('text')||'').trim();
      if(!msg) return;
      state.announcements.push({ id: uid(), text: msg, postedAt: new Date().toISOString() });
      save('Posted to the board.');
    }
  });

  function applyPick(gameId, type, pick, pointsRaw){
    // A player gets at most ONE wager per game per market (ATS or OU) --
    // never one on each side of the same market. Clearing every existing
    // match before (maybe) adding the new one makes that a hard guarantee
    // regardless of how many matches happen to exist already, rather than
    // trusting a single previously-found index.
    state.wagers = state.wagers.filter(function(w){
      return !(w.gameId === gameId && w.player === currentPlayer && w.type === type);
    });
    var points = parseInt(pointsRaw, 10);
    if(!pick || !points || points <= 0) return;
    var newWager = { id: uid(), gameId: gameId, player: currentPlayer, type: type, pick: pick, points: points };
    state.wagers.push(newWager);
    pendingAdditions.wagers.push(newWager);
  }

  // ---------- init ----------
  function init(){
    document.title = state.poolName;
    // Paint immediately with whatever was embedded in the page at deploy
    // time, then fetch the server's current copy -- this is what makes
    // picks/signups/admin changes from other visitors show up, since the
    // embedded copy is only ever as fresh as the last deploy.
    render();
    fetch('api.php?action=state').then(function(res){
      if(!res.ok) throw new Error('bad status ' + res.status);
      return res.json();
    }).then(function(body){
      // A signup or pick made in the moment between the page painting and
      // this fetch resolving would otherwise be silently erased by the
      // plain server copy replacing `state` below -- replay it on top
      // instead, then get it actually saved now that the real version is
      // known (save() bails out with only a 'this session only' warning
      // until serverVersion is set, which is exactly this line).
      var hadPending = pendingAdditions.players.length > 0 || pendingAdditions.wagers.length > 0;
      state = applyPendingAdditions(normalizeState(body.data));
      serverVersion = body.version;
      // Only now, against the server's actual current player list, is it
      // safe to decide whether a saved login is still valid.
      if(currentPlayer && !findPlayer(currentPlayer)){
        currentPlayer = null;
        try{ localStorage.removeItem('poolUsername'); }catch(e){}
      }
      document.title = state.poolName;
      render();
      if(hadPending) save();
    }).catch(function(){
      toast('Could not reach the server — showing a cached copy. Live saving is unavailable until this is fixed.', 6000);
    });
  }
  init();
})();
</script>
