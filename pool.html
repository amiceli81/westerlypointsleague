          '</select></div>' +
          '<div class="field"><label>Week / label</label><input name="week" value="' + esc(editing.week) + '" required></div>' +
          '<div class="field"><label>Kickoff (optional)</label><input type="datetime-local" name="kickoff" value="' + (editing.kickoff ? toLocalInputValue(editing.kickoff) : '') + '"></div>' +
        '</div>' +
        '<div class="grid2">' +
          '<div class="field"><label>Away team</label><input name="away" value="' + esc(editing.away) + '" required></div>' +
          '<div class="field"><label>Home team</label><input name="home" value="' + esc(editing.home) + '" required></div>' +
        '</div>' +
        '<div class="grid3">' +
          '<div class="field"><label>Favorite</label><select name="favorite">' +
            '<option value="home" ' + (editing.favorite==='home' ? 'selected':'') + '>Home team</option>' +
            '<option value="away" ' + (editing.favorite==='away' ? 'selected':'') + '>Away team</option>' +
          '</select></div>' +
          '<div class="field"><label>Spread (0 = pick\'em)</label><input class="mono" type="number" step="0.5" min="0" name="spread" value="' + editing.spread + '" required></div>' +
          '<div class="field"><label>Total (over/under)</label><input class="mono" type="number" step="0.5" min="0" name="total" value="' + editing.total + '" required></div>' +
        '</div>' +
        '<div class="pick-actions"><button type="button" class="btn ghost" data-action="cancel-edit-game">Cancel</button><button class="btn" type="submit">Save changes</button></div>' +
        '</form></div>';
    }

    var allBoardGames = sortedGames();
    var collapsed = view.gamesListCollapsed;
    // A final game drops off the board automatically (same idea as This
    // Week's "show locked games" toggle) so the list stays focused on
    // what's still in play -- the toggle below is an opt-in way to glance
    // back at finished games (e.g. to Reopen one that was settled wrong).
    var games = view.showFinishedGames ? allBoardGames : allBoardGames.filter(function(g){ return g.status !== 'final'; });
    var finishedCount = allBoardGames.length - allBoardGames.filter(function(g){ return g.status !== 'final'; }).length;
    var gamesList = '<div class="card"><div class="section-title" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">' +
      '<h3>Games on the board <span class="eyebrow">(' + games.length + ')</span></h3>' +
      '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
      (finishedCount ? '<label class="toggle"><input type="checkbox" data-action="toggle-finished-games" ' + (view.showFinishedGames?'checked':'') + '> Show finished games (' + finishedCount + ')</label>' : '') +
      (allBoardGames.length ? '<button type="button" class="btn ghost" data-action="toggle-games-list">' + (collapsed ? 'Expand' : 'Collapse') + '</button>' : '') +
      '</div></div>';
    if(!allBoardGames.length){
      gamesList += '<div class="empty" style="border:none">No games yet — sync in this week\'s odds to load matchups.</div>';
    } else if(collapsed){
      gamesList += '<div class="empty" style="border:none">' + games.length + ' game' + (games.length===1?'':'s') + ' hidden — click Expand to view.</div>';
    } else if(!games.length){
      gamesList += '<div class="empty" style="border:none">Every game has finished. Toggle "show finished games" above to review them.</div>';
    } else {
      games.forEach(function(g){
        gamesList += '<div class="admin-game-row"><div><strong>' + esc(g.away) + ' @ ' + esc(g.home) + '</strong><div class="meta">' + esc(g.sport) + ' · ' + esc(g.week) + ' · ' + (g.favorite==='home'?esc(g.home):esc(g.away)) + ' ' + fmtLine(-g.spread) + ' · O/U ' + fmtNum(g.total) + (g.status==='final' ? ' · Final ' + g.finalAway + '-' + g.finalHome : '') + '</div></div>' +
          '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
          (g.status === 'final'
            ? '<button type="button" class="btn ghost" data-action="reopen-game" data-game="' + g.id + '">Reopen</button>'
            : '<form class="inline-settle" data-action="settle-game" data-game="' + g.id + '"><input type="number" name="finalAway" placeholder="Away" required><span class="eyebrow">–</span><input type="number" name="finalHome" placeholder="Home" required><button class="btn ghost" type="submit">Settle</button></form>'
          ) +
          '<button type="button" class="btn ghost" data-action="edit-game" data-game="' + g.id + '">Edit</button>' +
          '<button type="button" class="btn danger" data-action="delete-game" data-game="' + g.id + '">Delete</button>' +
          '</div></div>';
      });
    }
    gamesList += '</div>';

    var settings = '<div class="card"><div class="section-title"><h3>Pool settings</h3></div>' +
      '<form class="panel" data-action="save-settings">' +
      '<div class="grid3">' +
        '<div class="field"><label>Pool name</label><input name="poolName" value="' + esc(state.poolName) + '" required></div>' +
        '<div class="field"><label>Starting balance</label><input class="mono" type="number" name="startingBalance" value="' + state.startingBalance + '" required></div>' +
        '<div class="field"><label>Commissioner PIN</label><input class="mono" name="commissionerPin" value="' + esc(state.commissionerPin) + '" required></div>' +
      '</div>' +
      '<div class="pick-actions"><button class="btn" type="submit">Save settings</button></div>' +
      '</form></div>';

    var weekVisibility = renderWeekVisibilityCard();
    var compliance = renderComplianceCard();
    var balanceAdjust = renderBalanceAdjustCard();
    var voidPicks = renderVoidPicksCard();
    var rosterBackup = renderRosterBackupCard();
    var bootPlayer = renderBootPlayerCard();
    var email = renderEmailCard();

    return addForm + gamesList + weekVisibility + compliance + balanceAdjust + voidPicks + rosterBackup + bootPlayer + email + settings;
  }

  function playersWithEmail(){
    return state.players.filter(function(p){ return p.email; });
  }

  function renderEmailCard(){
    // There's no email-sending service behind this page (a static, published
    // page can't send mail itself), so this composes a mailto: link with
    // every player's email address on BCC -- not To/CC, so nobody's address
    // is exposed to everyone else -- and hands it to the commissioner's own
    // mail client to review and send. It's one click short of automatic
    // rather than fully automatic, but it needs no server, no API key, and
    // no third-party access to your roster's email addresses.
    var recipients = playersWithEmail();
    var head = '<div class="section-title"><h3>Email the pool</h3></div>';
    if(!recipients.length){
      return '<div class="card">' + head + '<div class="empty" style="border:none">No players with an email on file yet.</div></div>';
    }
    var sub = '<p class="eyebrow" style="margin:-6px 0 12px">Opens your email app with all ' + recipients.length + ' player' + (recipients.length===1?'':'s') + ' BCC\'d, so addresses stay private between players.</p>';
    var form = '<form class="panel" data-action="compose-email">' +
      '<div class="field"><label>Subject</label><input name="subject" value="' + esc(state.poolName) + ' update" required></div>' +
      '<div class="field"><label>Message</label><textarea name="body" rows="5" placeholder="Write your message…" required></textarea></div>' +
      '<div class="pick-actions"><button class="btn" type="submit">Open email to ' + recipients.length + ' player' + (recipients.length===1?'':'s') + '</button></div>' +
      '</form>';
    return '<div class="card">' + head + sub + form + '</div>';
  }

  // ---------- events ----------
  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.getAttribute('data-action');
    if(action === 'set-tab'){
      view.tab = el.getAttribute('data-tab');
      render();
    } else if(action === 'enter-league'){
      enterLeague(el.getAttribute('data-league-id'));
    } else if(action === 'show-league-picker'){
      showLeaguePicker();
    } else if(action === 'log-out'){
      currentPlayer = null;
      setCurrentLeagueAccount({ username: null });
      render();
    } else if(action === 'goto-auth'){
      view.tab = 'week';
      render();
      var authEl = document.getElementById('auth-card');
      if(authEl) authEl.scrollIntoView({behavior:'smooth', block:'start'});
    } else if(action === 'auth-mode'){
      view.authMode = el.getAttribute('data-mode');
      if(view.authMode !== 'reset') view.resetVerifiedUsername = null;
      render();
    } else if(action === 'toggle-completed'){
      view.showCompleted = el.checked;
      render();
    } else if(action === 'set-sport-filter'){
      view.sportFilter = el.getAttribute('data-sport');
      render();
    } else if(action === 'toggle-compliance-sort'){
      view.complianceSortAsc = !view.complianceSortAsc;
      render();
    } else if(action === 'update-compliance-week'){
      if(!view.isCommissioner) return;
      state.complianceUpdatedAt = new Date().toISOString();
      save('Under-wagered report updated to the current week.');
    } else if(action === 'edit-game'){
      view.editingGameId = el.getAttribute('data-game');
      render();
      var f = document.querySelector('form[data-action="save-game"]');
      if(f) f.scrollIntoView({behavior:'smooth', block:'start'});
    } else if(action === 'cancel-edit-game'){
      view.editingGameId = null;
      render();
    } else if(action === 'view-player'){
      view.viewingPlayer = el.getAttribute('data-player');
      view.playerPicksWeekFilter = '';
      render();
      var pc = document.querySelector('[data-action="close-player-picks"]');
      if(pc) pc.closest('.card').scrollIntoView({behavior:'smooth', block:'start'});
    } else if(action === 'close-player-picks'){
      view.viewingPlayer = null;
      view.playerPicksWeekFilter = '';
      render();
    } else if(action === 'toggle-games-list'){
      view.gamesListCollapsed = !view.gamesListCollapsed;
      render();
    } else if(action === 'toggle-finished-games'){
      view.showFinishedGames = el.checked;
      render();
    } else if(action === 'toggle-void-picks'){
      view.voidPicksCollapsed = !view.voidPicksCollapsed;
      render();
    } else if(action === 'set-week-visibility'){
      if(!view.isCommissioner) return;
      var vSport = el.getAttribute('data-sport');
      var vWeek = el.getAttribute('data-week');
      var vValue = el.getAttribute('data-value');
      var vKey = weekKey(vSport, vWeek);
      if(vValue === 'show') state.weekVisibility[vKey] = true;
      else if(vValue === 'hide') state.weekVisibility[vKey] = false;
      else delete state.weekVisibility[vKey];
      save('Updated visibility for ' + vSport + ' — ' + vWeek + '.');
    } else if(action === 'download-compliance-csv'){
      if(!view.isCommissioner) return;
      if(!downloadsCap){ toast('Downloads aren\'t available in this view.'); return; }
      var stamp = new Date().toISOString().slice(0, 10);
      var safeName = (state.poolName || 'pool').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'pool';
      downloadsCap.save({ filename: safeName + '-under-wagered-' + stamp + '.csv', data: complianceCsvText() })
        .then(function(){ toast('Under-wagered CSV saved.'); })
        .catch(function(err){
          var code = err && err.code;
          if(code === 'declined') return;
          toast('Could not save the CSV file (' + (code || 'unknown error') + ').');
        });
    } else if(action === 'download-leaderboard-csv'){
      if(!downloadsCap){ toast('Downloads aren\'t available in this view.'); return; }
      var lb = leaderboardRows();
      var csvLines = [['Rank','Player','Wins','Losses','Pushes','Balance'].map(csvField).join(',')];
      lb.rows.forEach(function(r, i){
        csvLines.push([i+1, displayName(r.key), r.stats.wins, r.stats.losses, r.stats.pushes, r.stats.balance].map(csvField).join(','));
      });
      var csvText = csvLines.join('\r\n') + '\r\n';
      var stamp = new Date().toISOString().slice(0, 10);
      var safeName = (state.poolName || 'pool').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'pool';
      downloadsCap.save({ filename: safeName + '-leaderboard-' + stamp + '.csv', data: csvText })
        .then(function(){ toast('Leaderboard CSV saved.'); })
        .catch(function(err){
          var code = err && err.code;
          if(code === 'declined') return;
          toast('Could not save the CSV file (' + (code || 'unknown error') + ').');
        });
    } else if(action === 'download-roster-backup'){
      if(!view.isCommissioner) return;
      if(!downloadsCap){ toast('Downloads aren\'t available in this view.'); return; }
      var backup = {
        pool: state.poolName,
        exportedAt: new Date().toISOString(),
        accounts: rosterUsernames().map(function(u){
          var p = findPlayer(u);
          return p ? {
            username: p.username, teamName: p.teamName, firstName: p.firstName,
            lastName: p.lastName, email: p.email, createdAt: p.createdAt
          } : { username: u, note: 'wagered under this name but never created an account' };
        })
      };
      var stamp = new Date().toISOString().slice(0, 10);
      var safeName = (state.poolName || 'pool').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'pool';
      downloadsCap.save({ filename: safeName + '-roster-backup-' + stamp + '.json', data: JSON.stringify(backup, null, 2) })
        .then(function(){ toast('Roster backup saved.'); })
        .catch(function(err){
          var code = err && err.code;
          if(code === 'declined') return;
          toast('Could not save the backup file (' + (code || 'unknown error') + ').');
        });
    } else if(action === 'delete-game'){
      var gid = el.getAttribute('data-game');
      var g = gameById(gid);
      if(g && confirm('Delete ' + g.away + ' @ ' + g.home + '? This also removes every pick on it.')){
        state.games = state.games.filter(function(x){ return x.id !== gid; });
        state.wagers = state.wagers.filter(function(x){ return x.gameId !== gid; });
        save('Game deleted.');
      }
    } else if(action === 'reopen-game'){
      var g2 = gameById(el.getAttribute('data-game'));
      if(g2){ g2.status = 'open'; g2.finalHome = null; g2.finalAway = null; save('Game reopened.'); }
    } else if(action === 'void-pick'){
      if(!view.isCommissioner) return;
      var wagerId = el.getAttribute('data-wager');
      var wager = state.wagers.filter(function(w){ return w.id === wagerId; })[0];
      if(!wager) return;
      var voidGame = gameById(wager.gameId);
      var voidLabel = voidGame ? (voidGame.away + ' @ ' + voidGame.home) : 'this game';
      if(confirm('Void ' + displayName(wager.player) + '\'s ' + wager.type + ' pick on ' + voidLabel + ' (' + wager.points + ' pts)? This can\'t be undone.')){
        state.wagers = state.wagers.filter(function(w){ return w.id !== wagerId; });
        save('Pick voided.');
      }
    } else if(action === 'boot-player'){
      if(!view.isCommissioner) return;
      var bootUsername = el.getAttribute('data-player');
      var bootProfile = findPlayer(bootUsername);
      if(!bootProfile) return;
      if(confirm('Boot ' + bootProfile.teamName + ' (' + bootProfile.username + ')? This removes their account AND every wager they\'ve ever placed -- they\'ll disappear from the leaderboard, All Picks, and every other report. They\'ll be logged out immediately and can\'t log back in unless they sign up again. This can\'t be undone.')){
        state.players = state.players.filter(function(p){ return p.username !== bootUsername; });
        state.wagers = state.wagers.filter(function(w){ return w.player !== bootUsername; });
        if(currentPlayer === bootUsername){
          currentPlayer = null;
          setCurrentLeagueAccount({ username: null });
        }
        save('Player booted.');
      }
    } else if(action === 'delete-announcement'){
      if(!view.isCommissioner) return;
      var aid = el.getAttribute('data-id');
      state.announcements = state.announcements.filter(function(a){ return a.id !== aid; });
      save('Announcement removed.');
    }
  });

  document.addEventListener('change', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.getAttribute('data-action');
    if(action === 'filter-void-player'){
      view.voidPickFilter = el.value;
      render();
    } else if(action === 'filter-player-picks-week'){
      view.playerPicksWeekFilter = el.value;
      render();
    }
  });

  document.addEventListener('submit', function(e){
    var form = e.target.closest('[data-action]');
    if(!form) return;
    e.preventDefault();
    var action = form.getAttribute('data-action');
    var fd = new FormData(form);

    if(action === 'signup'){
      var suUsername = normalizeUsername(fd.get('username'));
      var suTeamName = String(fd.get('teamName')||'').trim();
      var suFirstName = String(fd.get('firstName')||'').trim();
      var suLastName = String(fd.get('lastName')||'').trim();
      var suEmail = String(fd.get('email')||'').trim();
      var suPassword = String(fd.get('password')||'');
      var suConfirm = String(fd.get('confirmPassword')||'');
      if(!suUsername || !suTeamName || !suFirstName || !suLastName || !suEmail || !suPassword){ toast('Please fill in every field.'); return; }
      if(!/^[a-z0-9_.-]{3,24}$/.test(suUsername)){ toast('Usernames: 3-24 characters, letters/numbers/._- only.'); return; }
      if(suPassword.length < 6){ toast('Password needs at least 6 characters.'); return; }
      if(suPassword !== suConfirm){ toast('Passwords don\'t match.'); return; }
      if(!/^\S+@\S+\.\S+$/.test(suEmail)){ toast('That doesn\'t look like a valid email address.'); return; }
      if(findPlayer(suUsername)){ toast('That username is taken — try another.'); return; }
      if(state.players.some(function(p){ return p.teamName.trim().toLowerCase() === suTeamName.toLowerCase(); })){ toast('That team name is already taken — try another.'); return; }
      hashNewPassword(suPassword).then(function(hashed){
        state.players.push({
          username: suUsername, salt: hashed.salt, passwordHash: hashed.hash,
          teamName: suTeamName, firstName: suFirstName, lastName: suLastName, email: suEmail,
          createdAt: new Date().toISOString()
        });
        currentPlayer = suUsername;
        setCurrentLeagueAccount({ username: suUsername });
        save('Welcome to the pool, ' + suTeamName + '!');
      });
    } else if(action === 'login'){
      var liUsername = normalizeUsername(fd.get('username'));
      var liPassword = String(fd.get('password')||'');
      var profile = findPlayer(liUsername);
      if(!profile){ toast('No account with that username.'); return; }
      verifyPassword(liPassword, profile.salt, profile.passwordHash).then(function(ok){
        if(!ok){ toast('Wrong password.'); return; }
        currentPlayer = profile.username;
        setCurrentLeagueAccount({ username: profile.username });
        render();
        toast('Welcome back, ' + profile.teamName + '.');
      });
    } else if(action === 'verify-reset'){
      var vrUsername = normalizeUsername(fd.get('username'));
      var vrEmail = String(fd.get('email')||'').trim().toLowerCase();
      var vrProfile = findPlayer(vrUsername);
      // No real email is sent -- this just checks the username and email on
      // file match, then lets them straight through to set a new password.
      if(!vrProfile || !vrProfile.email || vrProfile.email.trim().toLowerCase() !== vrEmail){
        toast('No account matches that username and email.');
        return;
      }
      view.resetVerifiedUsername = vrProfile.username;
      render();
    } else if(action === 'reset-password'){
      if(!view.resetVerifiedUsername) return;
      var rpProfile = findPlayer(view.resetVerifiedUsername);
      if(!rpProfile){ view.resetVerifiedUsername = null; render(); return; }
      var rpPassword = String(fd.get('password')||'');
      var rpConfirm = String(fd.get('confirmPassword')||'');
      if(rpPassword.length < 6){ toast('Password needs at least 6 characters.'); return; }
      if(rpPassword !== rpConfirm){ toast('Passwords don\'t match.'); return; }
      hashNewPassword(rpPassword).then(function(hashed){
        rpProfile.salt = hashed.salt;
        rpProfile.passwordHash = hashed.hash;
        view.resetVerifiedUsername = null;
        view.authMode = 'login';
        save('Password reset — you can log in with your new password now.');
      });
    } else if(action === 'save-picks'){
      var gameId = form.getAttribute('data-game');
      var g = gameById(gameId);
      if(!g || !currentPlayer || isLocked(g)) return;
      // The form itself is only rendered while the player isn't week-locked,
      // but a stale render (this game's kickoff was still in the future when
      // the page last drew it, and their first wagered game of the week has
      // since kicked off) can still post here -- tell them why it didn't
      // save instead of silently doing nothing.
      if(isWeekLockedForPlayer(g, currentPlayer)){ toast('Your first game has kicked off already.'); return; }
      // Any market with a pick actually selected must wager at least
      // MIN_WAGER points -- check both markets before saving either, so a
      // too-small wager on one doesn't silently let the other through.
      var atsPickVal = fd.get('ats-pick');
      var ouPickVal = fd.get('ou-pick');
      var atsPointsVal = parseInt(fd.get('ats-points'), 10);
      var ouPointsVal = parseInt(fd.get('ou-points'), 10);
      if((atsPickVal && atsPointsVal < MIN_WAGER) || (ouPickVal && ouPointsVal < MIN_WAGER)){
        toast('You must wager at least ' + MIN_WAGER + ' points.');
        return;
      }
      // All of a player's wagers this week, combined (including whatever
      // they're submitting right now across both markets on this game),
      // can't exceed the balance they had at the start of the week -- checked
      // here (not just the inputs' max attributes) in case a stale form
      // still posts a higher value.
      var weekBudgetVal = weekStartBalanceForGame(currentPlayer, g);
      var alreadyWageredVal = weekWageredSoFar(currentPlayer, g);
      var newWagerTotal = (atsPickVal ? atsPointsVal : 0) + (ouPickVal ? ouPointsVal : 0);
      if(newWagerTotal > weekBudgetVal - alreadyWageredVal){
        var remainingVal = Math.max(0, weekBudgetVal - alreadyWageredVal);
        toast('You only have ' + remainingVal + ' points left to wager this week — your total wagers can\'t exceed your balance at the start of the week.');
        return;
      }
      // Once a market has a submitted wager, it's final -- never overwrite an
      // existing pick, even if a stale form somehow still posts one (the UI
      // itself stops rendering an editable field for an already-submitted
      // market, but this guard is what actually enforces the rule).
      if(!playerWager(gameId, currentPlayer, 'ATS')) applyPick(gameId, 'ATS', atsPickVal, fd.get('ats-points'));
      if(!playerWager(gameId, currentPlayer, 'OU')) applyPick(gameId, 'OU', ouPickVal, fd.get('ou-points'));
      save('Picks saved.');
    } else if(action === 'admin-login'){
      var pin = String(fd.get('pin') || '').trim();
      if(pin === state.commissionerPin){
        view.isCommissioner = true;
        setCurrentLeagueAccount({ isCommissioner: true });
        render();
      } else {
        toast('Wrong PIN.');
      }
    } else if(action === 'create-league'){
      var newLeagueName = String(fd.get('name')||'').trim();
      if(!newLeagueName){ toast('Please enter a league name.'); return; }
      var newLeague = { id: uid(), name: newLeagueName, createdAt: new Date().toISOString(), data: normalizeLeagueData({poolName: newLeagueName}) };
      rootState.leagues.push(newLeague);
      enterLeague(newLeague.id);
      save('League created! You\'re in.');
    } else if(action === 'save-payment'){
      if(!view.isCommissioner) return;
      var payUsername = form.getAttribute('data-player');
      var payProfile = findPlayer(payUsername);
      if(!payProfile) return;
      payProfile.paid = fd.get('paid') === 'yes';
      payProfile.buyBack = fd.get('buyBack') === 'yes';
      payProfile.payType = String(fd.get('payType') || '').trim();
      save('Payment info saved.');
    } else if(action === 'save-game'){
      var editId = form.getAttribute('data-editing');
      var data = {
        sport: fd.get('sport'),
        week: String(fd.get('week')||'').trim() || 'Week 1',
        away: String(fd.get('away')||'').trim(),
        home: String(fd.get('home')||'').trim(),
        favorite: fd.get('favorite'),
        spread: Math.abs(parseFloat(fd.get('spread'))) || 0,
        total: parseFloat(fd.get('total')) || 0,
        kickoff: fd.get('kickoff') || null
      };
      if(!data.away || !data.home) return;
      if(editId){
        var g3 = gameById(editId);
        if(g3) Object.assign(g3, data);
        view.editingGameId = null;
        save('Game updated.');
      } else {
        data.id = uid();
        data.status = 'open';
        data.finalHome = null;
        data.finalAway = null;
        data.order = state.games.length;
        state.games.push(data);
        save('Game added.');
      }
    } else if(action === 'settle-game'){
      var gid2 = form.getAttribute('data-game');
      var g4 = gameById(gid2);
      var fa = parseInt(fd.get('finalAway'), 10);
      var fh = parseInt(fd.get('finalHome'), 10);
      if(!g4 || isNaN(fa) || isNaN(fh)) return;
      g4.finalAway = fa;
      g4.finalHome = fh;
      g4.status = 'final';
      save('Final score posted — results updated.');
    } else if(action === 'save-settings'){
      state.poolName = String(fd.get('poolName')||'').trim() || state.poolName;
      var sb = parseInt(fd.get('startingBalance'), 10);
      if(!isNaN(sb)) state.startingBalance = sb;
      var newPin = String(fd.get('commissionerPin')||'').trim();
      if(newPin) state.commissionerPin = newPin;
      document.title = state.poolName;
      save('Settings saved.');
    } else if(action === 'compose-email'){
      if(!view.isCommissioner) return;
      var recipients = playersWithEmail().map(function(p){ return p.email; });
      if(!recipients.length) return;
      var subject = String(fd.get('subject')||'').trim();
      var body = String(fd.get('body')||'');
      var mailto = 'mailto:?bcc=' + encodeURIComponent(recipients.join(',')) +
        '&subject=' + encodeURIComponent(subject) +
        '&body=' + encodeURIComponent(body);
      window.location.href = mailto;
    } else if(action === 'save-rules'){
      if(!view.isCommissioner) return;
      var rulesPin = String(fd.get('pin') || '').trim();
      if(rulesPin !== state.commissionerPin){ toast('Wrong PIN.'); return; }
      state.rulesText = String(fd.get('rulesText') || '');
      save('Rules saved.');
    } else if(action === 'adjust-balance'){
      if(!view.isCommissioner) return;
      var adjPlayer = String(fd.get('player') || '');
      var adjAmount = parseInt(fd.get('amount'), 10);
      var adjNote = String(fd.get('note') || '').trim();
      if(!adjPlayer || rosterUsernames().indexOf(adjPlayer) === -1 || !adjAmount) return;
      state.adjustments.push({ id: uid(), player: adjPlayer, amount: adjAmount, note: adjNote, ts: Date.now() });
      save('Adjusted ' + displayName(adjPlayer) + '\'s balance by ' + (adjAmount>0?'+':'') + adjAmount + '.');
    } else if(action === 'post-announcement'){
      if(!view.isCommissioner) return;
      var msg = String(fd.get('text')||'').trim();
      if(!msg) return;
      state.announcements.push({ id: uid(), text: msg, postedAt: new Date().toISOString() });
      save('Posted to the board.');
    }
  });

  function applyPick(gameId, type, pick, pointsRaw){
    // A player gets at most ONE wager per game per market (ATS or OU) --
    // never one on each side of the same market. Clearing every existing
    // match before (maybe) adding the new one makes that a hard guarantee
    // regardless of how many matches happen to exist already, rather than
    // trusting a single previously-found index.
    state.wagers = state.wagers.filter(function(w){
      return !(w.gameId === gameId && w.player === currentPlayer && w.type === type);
    });
    var points = parseInt(pointsRaw, 10);
    if(!pick || !points || points <= 0) return;
    state.wagers.push({ id: uid(), gameId: gameId, player: currentPlayer, type: type, pick: pick, points: points, placedAt: new Date().toISOString() });
  }

  // ---------- init ----------
  function init(){
    // document.title is already set correctly by activateLeague() (auto-
    // entered single league) or left as the generic site title (picker
    // showing, no league active) -- nothing to do here.
    if(window.claude && typeof window.claude.use === 'function'){
      window.claude.use('artifact').then(function(cap){
        artifactCap = cap;
        if(!cap && !warnedNoCap){ warnedNoCap = true; toast('Live saving isn\'t available in this view — changes will only last this session.', 4500); }
      });
      window.claude.use('downloads').then(function(cap){ downloadsCap = cap; });
    }
    render();
  }
  init();
})();
</script>
